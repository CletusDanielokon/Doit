{% extends "base.html" %}
{% block title %}{{ title }} – Do.iT{% endblock %}
{% block robots %}noindex{% endblock %}
{% block body_class %}auth{% endblock %}
{% block content %}
<main class="auth-wrap"><section class="auth-card">
  <img class="auth-logo" src="{{ asset('images/icon-192.png') }}" alt="Do.iT logo" width="72" height="72">
  <h1>{{ title }}</h1><p class="muted">{{ text }}</p>
  <a class="btn primary block lg" href="{{ button[1] }}">{{ button[0] }}</a>
</section></main>
{% endblock %}
