<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}Do.iT – Free Digital To-do List with Reminders & Alarms{% endblock %}</title>
  <meta name="description" content="{% block description %}Do.iT is a free digital to-do list app. Plan your day and week, get timetable reminders and real alarms, keep a diary and stay focused with a built-in timer.{% endblock %}">
  <meta name="robots" content="{% block robots %}index,follow{% endblock %}">
  <link rel="canonical" href="{% block canonical %}{{ site_url }}{{ request.path }}{% endblock %}">
  <meta name="theme-color" content="#0741dc">
  <meta name="application-name" content="Do.iT">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Do.iT">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Do.iT">
  <meta property="og:title" content="{% block og_title %}Do.iT – Free Digital To-do List with Reminders & Alarms{% endblock %}">
  <meta property="og:description" content="Plan your day, set alarms that actually ring, and get things done.">
  <meta property="og:url" content="{{ site_url }}{{ request.path }}">
  <meta property="og:image" content="{{ site_url }}{{ asset('images/og-image.png') }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Do.iT – Free Digital To-do List">
  <meta name="twitter:image" content="{{ site_url }}{{ asset('images/og-image.png') }}">
  <link rel="icon" type="image/x-icon" href="{{ asset('images/favicon.ico') }}">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ asset('images/icon-192.png') }}">
  <link rel="apple-touch-icon" href="{{ asset('images/apple-touch-icon.png') }}">
  <link rel="manifest" href="{{ url_for('manifest') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ asset('css/app.css') }}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

</body>
</html>
